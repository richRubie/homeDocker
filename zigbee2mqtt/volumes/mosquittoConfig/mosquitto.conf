# Authentication is required; anonymous clients are rejected.
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
# Logging to stdout keeps it in `docker compose logs` and avoids a host log file
# the broker cannot write to after it drops to the mosquitto user.
log_dest stdout

# Loopback only: Zigbee2MQTT and Home Assistant share the host network namespace.
listener 1883 127.0.0.1
protocol mqtt

# Only if an off-host client genuinely needs the broker, add a second listener
# bound to the Pi's LAN IP. Never bind to 0.0.0.0.
# listener 1883 192.168.1.10
# protocol mqtt